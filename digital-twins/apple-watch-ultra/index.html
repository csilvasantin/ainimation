<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Apple Watch Ultra · Gemelo 3D · AInimation Studio</title>
  <style>
    body { margin: 0; background: #070b15; color: #e5edf8; font: 14px/1.5 system-ui, sans-serif; }
    main { padding-top: var(--xs-bar-h, 0px); padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    main > header { padding: 16px 24px; }
    h1 { margin: 0; font-size: 19px; }
    #status, #physical { margin: 5px 0 0; color: #a5b8cc; }
    #physical { font-size: 12px; color: #8fa6c2; }
    .watch-workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 435px); gap: 20px; padding: 0 24px 24px; align-items: start; }
    .watch-scene { min-width: 0; background: #10182b; border: 1px solid #26344a; border-radius: 14px; overflow: hidden; }
    #watch { display: block; width: 100%; height: min(52vh, 560px); min-height: 260px; touch-action: none; }
    .watch-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; border-top: 1px solid #26344a; }
    .watch-controls button { color: inherit; background: #182439; border: 1px solid #435779; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
    .watch-controls button[aria-pressed="true"] { border-color: #ffbc44; color: #ffbc44; }
    .watch-controls small { color: #8fa6c2; }
    .watch-outputs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 10px; padding: 0 12px 12px; }
    .watch-outputs figure { margin: 0; padding: 8px; border: 1px solid #26344a; border-radius: 9px; background: #111b2d; }
    .watch-outputs figcaption { margin-bottom: 5px; color: #e5edf8; font-size: 11px; }
    .watch-outputs canvas { display: block; width: 100%; height: clamp(150px, 26vh, 251px); object-fit: contain; border-radius: 5px; background: #05080e; }
    .watch-outputs p { margin: 0; font-size: 12px; color: #a5b8cc; }
    .watch-outputs p + p { margin-top: 6px; }
    .watch-outputs a { color: #b1d2ff; }
    #importer { display: block; width: 100%; height: 610px; border: 1px solid #26344a; border-radius: 14px; background: #0a0c12; }
    @media (max-width: 900px) { .watch-workspace { grid-template-columns: 1fr; padding-inline: 14px; } #watch { height: min(46vh, 420px); } }
    #feed { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
  </style>
  <link rel="stylesheet" href="/digital-twins/twin-nav.css?v=abf1c89">
  <script defer src="/digital-twins/twin-nav.js?v=abf1c89"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <link rel="canonical" href="https://www.ainimation.studio/digital-twins/apple-watch-ultra/">
</head>
<body>
  <main>
    <header><h1>Apple Watch Ultra</h1><p id="status" role="status">Esperando la señal de Admira TV</p><p id="physical" role="status">Reloj físico: consultando…</p></header>
    <div class="watch-workspace">
      <section class="watch-scene" aria-label="Apple Watch Ultra">
        <canvas id="watch" aria-label="Gemelo 3D del Apple Watch Ultra con correa Ocean azul"></canvas>
        <div class="watch-controls">
          <button type="button" data-control="prev" aria-label="Pieza anterior (botón lateral)">◀ Anterior</button>
          <button type="button" data-control="toggle" aria-pressed="false" aria-label="Pausar o reanudar (corona digital)">⏯ Pausa</button>
          <button type="button" data-control="next" aria-label="Pieza siguiente (botón de Acción)">Siguiente ▶</button>
          <small>En el modelo: corona o pantalla = pausa · rueda sobre la corona = anterior/siguiente · botón naranja = siguiente · botón lateral = anterior · deslizar sobre la esfera: derecha = siguiente, izquierda = anterior.</small>
        </div>
        <div class="watch-outputs" aria-label="Salida del player">
          <figure>
            <figcaption>Esfera · 410 × 502</figcaption>
            <canvas id="face-output" width="410" height="502" aria-label="Emisión en la esfera del Apple Watch Ultra"></canvas>
          </figure>
          <figure>
            <figcaption>Cómo se cruzan el reloj real y el virtual</figcaption>
            <p>Los dos emiten la misma playlist de la pantalla <code>apple-watch-ultra</code> anclada al reloj del servidor de admira.tv. Lo que mandes aquí (pausa, anterior, siguiente) se aplica en el virtual al instante y viaja al reloj físico por <code>/api/apple-watch-state</code>; el botón se ilumina en ámbar hasta que el reloj devuelve su eco y en verde al confirmarlo.</p>
            <p>Lo que hagas en el reloj físico (corona, toque) llega como telemetría y el virtual lo sigue. El reloj late en la flota como un player más: <a href="https://admira.tv/players.html" target="_blank" rel="noopener noreferrer">admira.tv/players ↗</a>.</p>
            <p>App watchOS del reloj físico: <code>admira-tv/tools/apple-watch-player</code>.</p>
          </figure>
        </div>
      </section>
      <iframe id="importer" data-src="https://admira.tv/mando?embed=galleon&amp;screen=apple-watch-ultra" title="Playlist del Apple Watch Ultra en Admira TV"></iframe>
    </div>
  </main>
  <iframe id="feed" allow="autoplay" data-src="https://admira.tv/apple-watch.html" tabindex="-1" title="Señal del player del Apple Watch Ultra"></iframe>
  <script type="module" src="./twin.mjs?v=abf1c89"></script>
</body>
</html>
