name = "ainimation-mcp"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Dominio propio (LaLiga bloquea *.workers.dev en horas de fútbol, FLT-1633): mismo patrón que
# mcp-pixeria.admira.store y mcp-tv.admira.store.
[[routes]]
pattern = "mcp-ainimation.admira.store"
custom_domain = true

# Gestor de colas del quiosco (7-oct-2026): un Durable Object por tienda.
[[durable_objects.bindings]]
name = "COLA"
class_name = "ColaTienda"

[[migrations]]
tag = "cola-v1"
new_sqlite_classes = ["ColaTienda"]

# Voz de Admirito (ElevenLabs): reutiliza el secret de la flota guardado en omnipublicity-api.
# Alternativa: `npx wrangler secret put ELEVENLABS_API_KEY` en este worker (nunca en git).
[[services]]
binding = "OMNI"
service = "omnipublicity-api"

# Audiencia del quiosco segmentado (8-oct-2026): recuentos anónimos por visita, 90 días, sin imágenes.
# La misma base la lee el backoffice de admira.tv (/audiencia, Pages Functions con sesión).
[[d1_databases]]
binding = "AUDIENCIA_DB"
database_name = "kiosko-audiencia"
database_id = "4b5f2c81-aadf-4b1a-a363-f991c5240613"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
SITIO = "https://www.ainimation.studio"
STOCK_API = "https://api.admira.store"
VERSION = "v.08.10.2026.r29.00:16"
