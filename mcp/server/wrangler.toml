name = "ainimation-mcp"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Dominio propio (LaLiga bloquea *.workers.dev en horas de fútbol, FLT-1633): mismo patrón que
# mcp-pixeria.admira.store y mcp-tv.admira.store.
[[routes]]
pattern = "mcp-ainimation.admira.store"
custom_domain = true

# Gestor de colas del quiosco (7-oct-2026): un Durable Object por tienda.
[[durable_objects.bindings]]
name = "COLA"
class_name = "ColaTienda"

[[migrations]]
tag = "cola-v1"
new_sqlite_classes = ["ColaTienda"]

[observability]
enabled = true

[vars]
SITIO = "https://www.ainimation.studio"
STOCK_API = "https://api.admira.store"
VERSION = "v.07.10.2026.r14.12:19"
