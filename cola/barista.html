<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Barista · cola de pedidos (demo)</title>
<style>
body{margin:0;font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;background:#1E3932;color:#fff;padding:16px}
h1{margin:0 0 4px;font-size:22px}p{opacity:.8;margin:0 0 14px}
.p{display:flex;align-items:center;gap:12px;background:#fff1;border-radius:12px;padding:10px 14px;margin:8px 0}
.p b{font-size:30px;min-width:90px}.p span{flex:1;opacity:.85}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 16px;background:#00A862;color:#fff;cursor:pointer}
button.r{background:#d4e9e2;color:#1E3932}
.warn{background:#FFE58A;color:#3A2E00;font-weight:700;border-radius:10px;padding:8px 12px;margin-bottom:12px}
</style>
</head>
<body>
<div class="warn" id="w">DEMO · pedidos de ejemplo, pago SIMULADO. Los pedidos también pasan solos a «listo» a los ~20 s.</div>
<h1 id="h">Barista · avanzar pedidos</h1><p id="s"></p>
<div id="l"></div>
<script>
(function(){
const P=new URLSearchParams(location.search),store=(P.get('store')||'starbucks-paseo-de-gracia').replace(/[^a-z0-9-]/g,'')||'starbucks-paseo-de-gracia',relay='https://mcp-ainimation.admira.store',en=(P.get('lang')||'').startsWith('en');
const L=en?{prep:'Preparing',listo:'Ready',btnL:'Mark ready',btnR:'Collected',h:'Barista · advance orders',w:'DEMO · sample orders, SIMULATED payment. Orders also turn «ready» by themselves after ~20 s.',v:'No open orders'}:{prep:'En preparación',listo:'Listo',btnL:'Marcar listo',btnR:'Recogido',h:'Barista · avanzar pedidos',w:'DEMO · pedidos de ejemplo, pago SIMULADO. Los pedidos también pasan solos a «listo» a los ~20 s.',v:'No hay pedidos abiertos'};
h.textContent=L.h;w.textContent=L.w;s.textContent=store;
async function av(n,a){await fetch(relay+'/cola/avanzar?store='+store,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({numero:n,a})});tic();}
let ultimo='';
async function tic(){const d=await (await fetch(relay+'/cola/estado?store='+store,{cache:'no-store'})).json();
  const f=(p,e)=>'<div class="p"><b>'+p.numero+'</b><span>'+(e==='listo'?L.listo:L.prep)+'</span>'+(e==='listo'?'':'<button data-n="'+p.numero+'" data-a="listo">'+L.btnL+'</button>')+'<button class="r" data-n="'+p.numero+'" data-a="recogido">'+L.btnR+'</button></div>';
  const html=(d.preparando||[]).map(p=>f(p,'preparando')).join('')+(d.listo||[]).map(p=>f(p,'listo')).join('');const nuevo=html||'<p>'+L.v+'</p>';if(nuevo!==ultimo){ultimo=nuevo;l.innerHTML=nuevo;window.__baristaRenders=(window.__baristaRenders||0)+1;}}
l.onclick=e=>{const b=e.target.closest('button');if(b)av(b.dataset.n,b.dataset.a);};
tic();setInterval(tic,2500);
})();
</script>
</body>
</html>
