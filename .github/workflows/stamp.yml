# ============================================================================
# stamp.yml — el token de caché se pone SOLO al hacer push (C6)
# ----------------------------------------------------------------------------
# `npm run stamp` deriva el ?v= del sha del último commit que tocó assets/, pero
# hasta ahora había que acordarse de ejecutarlo a mano: el mismo problema que
# venía a resolver, solo que movido de sitio. Un JS caducado en un kiosko no se
# nota hasta que alguien está delante de la pantalla.
#
# Aquí se sella en el push:
#   · en main            → sella y devuelve el commit del sello (Pages sirve main)
#   · en cualquier otra  → solo comprueba, y falla si el ?v= está desfasado
#
# No hay bucle: el commit del sello solo toca *.html, así que el sha del último
# commit sobre assets/ no cambia → la siguiente ejecución no encuentra nada que
# sellar y no commitea.
# ============================================================================
name: stamp

on:
  push:
    paths: ["assets/**", "**/*.html", "scripts/stamp-version.mjs", ".github/workflows/stamp.yml"]
  pull_request:
    paths: ["assets/**", "**/*.html", "scripts/stamp-version.mjs"]

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # el script mira el historial de assets/: sin él, git log no ve nada
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fuera de main no escribimos en el repo de nadie: solo avisamos.
      - name: Comprobar el sello
        # Solo en PR: comprueba que la rama llega sellada (Jobs/Carlos, 9-sep-2026, encargo #2908).
        if: github.event_name == 'pull_request'
        run: npm run verify:stamp

      - name: Sellar y devolver el commit
        # En CUALQUIER push (main o rama): se sella y se devuelve el commit. Antes solo main, y cada
        # push a una rama con ?v= desfasado fallaba en «Comprobar» y mandaba un correo (encargo #2908).
        if: github.event_name == 'push'
        run: |
          npm run stamp
          if git diff --quiet -- '*.html'; then
            echo "✓ los ?v= ya estaban al día"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # pathspec de git (no glob del shell): `./*.html` solo veía la raíz y dejaba fuera
          # xperiencias/index.html, así que el commit salía vacío y el run fallaba con
          # «nothing to commit» en cada push (FLT-100147, 9-sep-2026).
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "✓ nada que commitir tras add"
            exit 0
          fi
          git commit -m "chore: sellar ?v= con el sha del commit de assets (automático)"
          git push
