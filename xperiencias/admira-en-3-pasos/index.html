    <script>/* ============================================================================
 * XPL — Xpace Programming Language (runtime)
 * ----------------------------------------------------------------------------
 * Lenguaje de reglas para el gemelo digital de XpaceOS.
 * Una regla es:   CUANDO <hecho>  [PARA <selector>]  ENTONCES <acción(es)>
 * (WHEN <fact>    [FOR <selector>] THEN <action(s)>)
 *
 * Este fichero NO toca el DOM: define los catálogos, el compilador y el motor.
 * Para usarlo necesita un "world adapter" (ver más abajo) que conecta los
 * hechos y las acciones con un mundo real (el gemelo) o simulado (el playground).
 *
 * Uso:
 *   const engine = XPL.createEngine(worldAdapter);
 *   engine.setRules(blocks);     // array de bloques-regla (JSON)
 *   engine.tick();               // evaluar y aplicar (llamar en el bucle del mundo)
 *
 * Vanilla JS, sin build. Expuesto como window.XPL (y module.exports si procede).
 * ========================================================================== */
(function (root) {
  'use strict';

  /* --------------------------------------------------------------------------
   * 1) CATÁLOGO DE HECHOS  (lo que el mundo "sabe" — las condiciones del CUANDO)
   * ------------------------------------------------------------------------ */
  // type: 'bool' | 'num' | 'enum'
  // El adapter resuelve world.fact(id) -> valor actual.
  // 10+ condiciones del mundo del gemelo (clima, gente, tiempo, negocio…).
  const FACTS = [

  /* --------------------------------------------------------------------------
   * Helpers de catálogo
   * ------------------------------------------------------------------------ */
  const byId = (arr, id) => arr.find(x => x.id === id) || null;
  const L = (obj, lang) => (obj && (obj[lang] || obj.es || obj.en)) || '';

  /* --------------------------------------------------------------------------
   * 4) COMPILADOR / RENDER A FRASE
   *    Un bloque-regla (JSON) -> frase legible bilingüe.
   * ------------------------------------------------------------------------ */
  // Normaliza el campo `when` a { join:'and'|'or', conds:[cond,...] }.
  // Acepta el formato antiguo (when con .fact directamente) por compatibilidad.
  function condsOf(when) {
    if (!when) return { join: 'and', conds: [] };
    if (when.conds) return { join: when.join === 'or' ? 'or' : 'and', conds: when.conds };
    if (when.fact) return { join: 'and', conds: [when] }; // formato antiguo = 1 condición
    return { join: 'and', conds: [] };
  }

  // Frase de UNA condición
  function condPhrase(cond, lang) {
    if (!cond || !cond.fact) return lang === 'en' ? '(no condition)' : '(sin condición)';
    const f = factById(cond.fact);
    if (!f) return cond.fact;
    if (f.type === 'ref') {
      const any = lang === 'en' ? 'anything' : 'lo que sea';
      return `${f.icon || ''} ${L(f, lang)} ${cond.value ? `“${cond.value}”` : any}`.trim();
    }
    if (f.type === 'bool') {
      const neg = cond.value === false || cond.negate === true;
      const base = `${f.icon || ''} ${L(f, lang)}`.trim();
      if (!neg) return base;
      return lang === 'en' ? `it is NOT the case that ${L(f, lang)}` : `NO ${L(f, lang)}`;
    }
    if (f.type === 'enum') {
      const v = byId(f.values || [], cond.value);
      const vl = v ? `${v.icon ? v.icon + ' ' : ''}${L(v, lang)}` : (cond.value || '…');
      return lang === 'en' ? `${f.icon || ''} ${L(f, lang)} is ${vl}`.trim()
                           : `${f.icon || ''} ${L(f, lang)} es ${vl}`.trim();
    }
    const op = byId(OPS, cond.op || '>=');
    return `${f.icon || ''} ${L(f, lang)} ${L(op, lang)} ${cond.value}${f.unit || ''}`.trim();
  }

  // Frase del WHEN completo (varias condiciones unidas por Y/O)
  function whenPhrase(when, lang) {
    const { join, conds } = condsOf(when);
    if (!conds.length) return lang === 'en' ? '(no condition)' : '(sin condición)';
    const sep = join === 'or' ? (lang === 'en' ? ' OR ' : ' O ') : (lang === 'en' ? ' AND ' : ' Y ');
    return conds.map(c => condPhrase(c, lang)).join(sep);
  }
  const factPhrase = whenPhrase; // alias compat

  function whoPhrase(who, lang) {
    if (!who || !who.group) return '';
    const g = byId(GROUPS, who.group);
    let s = L(g, lang);
    if (who.filter && who.filter.attr) {
      const a = byId(ATTRS, who.filter.attr);
      if (a) {
        if (a.type === 'bool') {
          const yes = who.filter.value !== false;
          s += lang === 'en'
            ? ` who ${yes ? '' : "don't "}${L(a, lang).replace(/^has an?/, yes ? 'have an' : 'have an')}`
            : ` que ${yes ? '' : 'no '}${L(a, lang).replace(/^lleva/, 'llevan')}`;
        } else {
          const v = byId(a.values || [], who.filter.value);
          s += lang === 'en' ? ` whose ${L(a, lang)} is ${L(v, lang)}` : ` cuya ${L(a, lang)} es ${L(v, lang)}`;
        }
      }
    }
    return s;
  }

  function actionPhrase(act, lang) {
    if (!act || !act.id) return '';
    const a = actionById(act.id);
    if (!a) return act.id;
    let s = L(a, lang);
    if (a.param) {
      if (a.param.kind === 'enum') {
        const v = byId(a.param.values || [], act.value);
        s += ' ' + (v ? `${v.icon ? v.icon + ' ' : ''}${L(v, lang)}` : (act.value || '…'));
      } else {
        s += ` “${act.value || '…'}”`;
      }
    }
    if (a.param2) s += ` “${act.value2 || '…'}”`;
    return s;
  }

  // Frase completa de una regla
  function ruleSentence(block, lang) {
    lang = lang || 'es';
    const when = factPhrase(block.when, lang);
    const acts = (block.do || []).map(a => actionPhrase(a, lang)).filter(Boolean);
    const needsWho = (block.do || []).some(a => (actionById(a.id) || {}).scope === 'npc');
    const who = needsWho ? whoPhrase(block.who, lang) : '';
    if (lang === 'en') {
      let s = `WHEN ${when}`;
      if (who) s += `, take ${who} and`;
      s += ` THEN ${acts.join(' and ') || '(nothing)'}`;
      return s;
    }
    let s = `CUANDO ${when}`;
    if (who) s += `, coge ${who} y`;
    s += ` ENTONCES ${acts.join(' y ') || '(nada)'}`;
    return s;
  }

  /* --------------------------------------------------------------------------
   * 5) EVALUACIÓN
   * ------------------------------------------------------------------------ */
  // Evalúa UNA condición contra el mundo
  function evalCond(cond, world) {
    if (!cond || !cond.fact) return true;
    const f = factById(cond.fact);
    if (!f) return false;
    const cur = world.fact(cond.fact);
    // 'ref': el mundo devuelve el nombre de lo ocurrido ahora ('' si nada).
    // Condición sin valor = "cualquiera" (basta con que haya ocurrido algo).
    if (f.type === 'ref') {
      if (cur === undefined || cur === null || cur === '') return false;
      return cond.value ? String(cur) === String(cond.value) : true;
    }
    if (f.type === 'bool') {
      const want = !(cond.value === false || cond.negate === true);
      return !!cur === want;
    }
    if (f.type === 'enum') return cur === cond.value;
    const v = Number(cond.value);
    switch (cond.op) {
      case '>':  return cur >  v;
      case '>=': return cur >= v;
      case '<':  return cur <  v;
      case '<=': return cur <= v;
      case '==': return cur == v;
      default:   return cur >= v;
    }
  }

  // Evalúa el WHEN completo (Y = todas; O = alguna)
  function evalCondition(when, world) {
    const { join, conds } = condsOf(when);
    if (!conds.length) return true; // sin condición => siempre
    return join === 'or'
      ? conds.some(c => evalCond(c, world))
      : conds.every(c => evalCond(c, world));
  }

  function npcMatches(npc, who) {
    if (!who || !who.group) return false;
    if (who.group !== 'all' && npc.kind !== who.group) return false;
    const flt = who.filter;
    if (flt && flt.attr) {
      const a = byId(ATTRS, flt.attr);
      if (a) {
        if (a.type === 'bool') {
          const want = flt.value !== false;
          if (!!npc[flt.attr] !== want) return false;
        } else {
          if (npc[flt.attr] !== flt.value) return false;
        }
      }
    }
    return true;
  }

  /* --------------------------------------------------------------------------
   * 6) MOTOR
   * ------------------------------------------------------------------------ */
  function createEngine(world) {
    let rules = [];
    const state = new Map(); // id -> { active:bool } para los flancos (mode 'on')

    function setRules(blocks) {
      rules = (blocks || []).slice();
      // limpia estado de reglas que ya no existen
      const ids = new Set(rules.map(r => r.id));
      for (const k of [...state.keys()]) if (!ids.has(k)) state.delete(k);
    }

    function applyAction(act, world, targets) {
      const a = actionById(act.id);
      if (!a) return;
      // 4º argumento = la acción entera, para las que llevan param2 (setText).
      // Los adapters antiguos lo ignoran, así que no rompe al gemelo.
      if (a.scope === 'npc') {
        for (const npc of targets) world.act(act.id, act.value, npc, act);
      } else { // 'world' | 'screen' | 'stage' -> se aplica una vez
        world.act(act.id, act.value, null, act);
      }
    }

    // Canal de pantalla para resolver conflictos: la "content" (showAd/clearScreen)
    // y el "tone" se resuelven por prioridad — solo gana una regla por canal.
    const SCREEN_CHANNEL = { showAd: 'content', showContent: 'content', clearScreen: 'content', screenTone: 'tone',
      showExtAd: 'extContent', clearExtScreen: 'extContent' };

    function tick() {
      const npcs = world.npcs ? world.npcs() : [];
      const log = [];
      const screenBids = {};   // canal -> { prio, idx, act }

      rules.forEach((rule, idx) => {
        if (rule.enabled === false) return;
        const cond = evalCondition(rule.when, world);
        const st = state.get(rule.id) || { active: false };
        const rising = cond && !st.active;
        const prio = Number(rule.priority || 0);
        for (const act of (rule.do || [])) {
          const a = actionById(act.id);
          if (!a) continue;
          const fire = a.mode === 'on' ? rising : cond;
          if (!fire) continue;
          if (a.scope === 'screen' || a.scope === 'extScreen') {
            // no se aplica aún: compite por su canal (mayor prioridad gana;
            // empate -> la regla declarada más abajo, como en una cascada)
            const ch = SCREEN_CHANNEL[act.id] || 'content';
            const cur = screenBids[ch];
            if (!cur || prio > cur.prio || (prio === cur.prio && idx >= cur.idx)) {
              screenBids[ch] = { prio, idx, act };
            }
          } else {
            const targets = a.scope === 'npc' ? npcs.filter(n => npcMatches(n, rule.who)) : [];
            applyAction(act, world, targets);
          }
          if (a.mode === 'on') log.push({ rule: rule.id, action: act.id });
        }
        state.set(rule.id, { active: cond });
      });

      // aplica el ganador de cada canal de pantalla
      for (const ch of Object.keys(screenBids)) applyAction(screenBids[ch].act, world, []);
      return log;
    }

    return { setRules, tick, get rules() { return rules; } };
  }

  /* --------------------------------------------------------------------------
   * 7) EXPORT
   * ------------------------------------------------------------------------ */
  const XPL = {
    FACTS, OPS, GROUPS, ATTRS, ACTIONS, ADS,
    DIRECTOR_FACTS, DIRECTOR_ACTIONS,
    // Catálogo por dominio: 'twin' (lo de siempre) | 'director' (interactivos)
    // | 'all'. El gemelo y el Templo siguen leyendo XPL.FACTS/ACTIONS a pelo.
    facts:   (domain) => domain === 'director' ? DIRECTOR_FACTS.slice()
                       : domain === 'all' ? FACTS.concat(DIRECTOR_FACTS) : FACTS.slice(),
    actions: (domain) => domain === 'director' ? DIRECTOR_ACTIONS.slice()
                       : domain === 'all' ? ACTIONS.concat(DIRECTOR_ACTIONS) : ACTIONS.slice(),
    byId, factById, actionById, label: L,
    ruleSentence, factPhrase, whenPhrase, condPhrase, condsOf, whoPhrase, actionPhrase,
    evalCondition, evalCond, npcMatches,
    createEngine,
    version: '0.2.0'
  };

  root.XPL = XPL;
  if (typeof module !== 'undefined' && module.exports) module.exports = XPL;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
    <script>
(function () {
  "use strict";
  var plan  = JSON.parse(document.getElementById("xp-plan").textContent);
  var rules = JSON.parse(document.getElementById("xp-rules").textContent);
  var marks = plan.markers || [];
  var fps   = Number(plan.fps || 24);
  var total = Number(plan.totalFrames || 240);
  var stage = document.getElementById("stage");

  /* --- tiempo --- */
  var frame = 1, playing = true, until = null, last = 0;
  function goToFrame(f) { frame = Math.min(Math.max(Number(f) || 1, 1), total); paint(); }
  function markFrame(label) {
    for (var i = 0; i < marks.length; i += 1) if (marks[i].label === label) return marks[i].frame;
    return null;
  }

  /* --- keyframes: mismo modelo que el Studio (porcentajes + estilo de texto) --- */
  function at(item, f) {
    var ks = (item.keyframes || []).slice().sort(function (a, b) { return a.frame - b.frame; });
    if (!ks.length) return item;
    var prev = ks[0], next = ks[ks.length - 1];
    for (var i = 0; i < ks.length; i += 1) {
      if (ks[i].frame <= f) prev = ks[i];
      if (ks[i].frame >= f) { next = ks[i]; break; }
    }
    if (prev.frame === next.frame) return prev;
    var t = (f - prev.frame) / (next.frame - prev.frame);
    var mix = function (a, b) { return a + (b - a) * t; };
    return { x: mix(prev.x, next.x), y: mix(prev.y, next.y), w: mix(prev.w, next.w), h: mix(prev.h, next.h),
             color: prev.color || next.color, text: prev.text || next.text,
             fontWeight: prev.fontWeight, fontStyle: prev.fontStyle,
             textDecoration: prev.textDecoration, textAlign: prev.textAlign, fontSize: prev.fontSize };
  }

  /* --- pintado --- */
  var nodes = {};
  var hidden = {};
  var texts  = {};
  function ensure(id, make) { if (!nodes[id]) { nodes[id] = make(); stage.appendChild(nodes[id]); } return nodes[id]; }

  function paintOne(obj, id, kind) {
    var start = Number(obj.startFrame || 1);
    var end   = start + Number(obj.durationFrames || total);
    var live  = frame >= start && frame <= end && !hidden[obj.spriteName];
    var k = at(obj, frame);
    var node = ensure(id, function () {
      var n = document.createElement(kind === "cast" ? (obj.mediaType === "video" ? "video" : "img") : "div");
      if (kind === "cast") { n.src = obj.src; if (obj.mediaType === "video") { n.muted = true; n.loop = true; n.playsInline = true; } }
      n.className = "xp-item";
      if (obj.interactive) { n.dataset.sprite = obj.spriteName; n.classList.add("xp-hot"); }
      return n;
    });
    node.style.display = live ? "block" : "none";
    if (!live) return;
    node.style.left = k.x + "%"; node.style.top = k.y + "%";
    node.style.width = k.w + "%"; node.style.height = k.h + "%";
    if (kind === "item") {
      var type = obj.type || "rect-fill";
      var filled = /-fill$/.test(type);
      var oval = /^oval/.test(type);
      node.style.background = filled ? (k.color || "#c6f24e") : "transparent";
      node.style.border = filled ? "0" : "2px solid " + (k.color || "#c6f24e");
      node.style.borderRadius = oval ? "50%" : "0";
      if (type === "text") {
        node.style.background = "transparent"; node.style.border = "0";
        node.textContent = texts[obj.spriteName] != null ? texts[obj.spriteName] : (k.text || obj.text || "");
        node.style.color = k.color || "#f8f7f2";
        node.style.font = (k.fontStyle || "normal") + " " + (k.fontWeight || "850") + " " + (k.fontSize || "3vw") + "/1.15 system-ui, sans-serif";
        node.style.textAlign = k.textAlign || "left";
        node.style.textDecoration = k.textDecoration || "none";
      }
    }
  }

  function paint() {
    (plan.stageItems || []).forEach(function (item) { paintOne(item, "item:" + item.id, "item"); });
    (plan.cast || []).forEach(function (member, i) {
      if (member && member.src) paintOne(member, "cast:" + i, "cast");
    });
  }

  /* --- XPL: los mismos hechos y acciones del catálogo Director --- */
  var bus = { click: "", hover: "", marker: "" };
  var lastInput = Date.now(), seen = 0;
  var world = {
    npcs: function () { return []; },
    fact: function (id) {
      var h = new Date().getHours();
      switch (id) {
        case "click": return bus.click;
        case "hover": return bus.hover;
        case "markerReached": return bus.marker;
        case "frame": return frame;
        case "idleSeconds": return (Date.now() - lastInput) / 1000;
        case "hour": return h;
        case "night": return h >= 21 || h < 7;
        case "weekend": var d = new Date().getDay(); return d === 0 || d === 6;
        case "dayPart": return h < 12 ? "morning" : h < 15 ? "noon" : h < 21 ? "afternoon" : "night";
        default: return undefined;
      }
    },
    act: function (id, value) {
      var f;
      switch (id) {
        case "goToMarker":  f = markFrame(value); if (f) { goToFrame(f); playing = true; } break;
        case "playSegment": f = markFrame(value); if (f) { until = f; playing = true; } break;
        case "showCast":    delete hidden[value]; break;
        case "hideCast":    hidden[value] = true; break;
        case "setText":     texts[value] = arguments[3] && arguments[3].value2 || ""; break;
        case "playSound":   var a = document.querySelector('[data-sound="' + value + '"]'); if (a) { a.currentTime = 0; a.play(); } break;
        case "openUrl":     if (value) window.open(value, "_blank", "noopener"); break;
      }
    }
  };

  var engine = window.XPL && window.XPL.createEngine ? window.XPL.createEngine(world) : null;
  if (engine) engine.setRules(rules);

  stage.addEventListener("pointerdown", function (event) {
    lastInput = Date.now();
    var hot = event.target.closest("[data-sprite]");
    if (hot) bus.click = hot.dataset.sprite;
  }, true);
  stage.addEventListener("pointermove", function (event) {
    var hot = event.target.closest("[data-sprite]");
    bus.hover = hot ? hot.dataset.sprite : "";
  }, true);

  /* --- bucle --- */
  function loop(ts) {
    if (playing && ts - last >= 1000 / fps) {
      last = ts;
      frame = frame >= total ? 1 : frame + 1;
      if (until && frame >= until) { until = null; playing = false; }
    }
    bus.marker = "";
    for (var i = 0; i < marks.length; i += 1) {
      if (marks[i].frame > seen && marks[i].frame <= frame) bus.marker = marks[i].label;
    }
    seen = frame;
    if (engine) engine.tick();
    paint();
    bus.click = "";
    requestAnimationFrame(loop);
  }
  paint();
  requestAnimationFrame(loop);

  /* --- la pieza anuncia cuánto dura ---------------------------------------
   * Quien la emite (el canal de admira.tv) no puede leer nada de dentro de un
   * iframe de otro dominio, así que la pieza lo DICE. Se repite un par de veces
   * por si el que escucha llega tarde; es un mensaje idempotente. */
  var segundos = Number(plan.durationSeconds) || 60;
  function anunciaDuracion() {
    if (window.parent === window) return;
    try {
      window.parent.postMessage({ source: "ainimation-xperiencia", event: "duration",
        seconds: segundos, title: plan.title || "" }, "*");
    } catch (e) {}
  }
  anunciaDuracion();
  setTimeout(anunciaDuracion, 400);
  setTimeout(anunciaDuracion, 1500);

  window.XPERIENCIA = { goToFrame: goToFrame, frame: function () { return frame; },
    world: world, plan: plan, rules: rules, seconds: segundos };
})();
</script>
