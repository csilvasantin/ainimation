<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Quiosco de pedido · AInimation Xperiencia</title>
<meta name="description" content="Xperiencia de quiosco de pedido (se adapta a 9:16, 16:9, cuadrado y tótems) para players Retail OS: carta por establecimiento, opciones, carrito, pago QR simulado y número de pedido.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--mb-primario:#00704A;--mb-primario-texto:#fff;--mb-secundario:#1E3932;--mb-secundario-texto:#fff;--mb-acento:#CBA258;--mb-acento-texto:#1E1A12;--mb-fondo:#fff;--mb-fondo-alt:#F2F0EB;--mb-superficie:#fff;--mb-superficie-alt:#EDEBE6;--mb-borde:#D9D6CF;--mb-texto:#1E2A25;--mb-texto-suave:#55605B;--mb-ok:#2F7D4F;--mb-error:#C0392B;--mb-font:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--mb-font);user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center;background:var(--mb-fondo);color:var(--mb-texto);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
header.bar{height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:var(--mb-secundario);color:var(--mb-secundario-texto)}
.logo{height:56px;display:flex;align-items:center;font-weight:800;font-size:40px;letter-spacing:3px}
.logo img{height:56px;max-width:420px}
.logo svg{height:56px;width:auto}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}
.lang{background:transparent;color:inherit;border:3px solid currentColor;border-radius:999px;padding:12px 26px;font-size:28px;font-weight:700}
.demo{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;text-align:center;font-size:22px;background:#FFE58A;color:#3A2E00;font-weight:700;z-index:50}
/* atracción */
#s-attract{background:var(--mb-secundario);color:var(--mb-secundario-texto);align-items:center;justify-content:center;text-align:center}
#s-attract .hero{width:720px;height:720px;position:relative;margin:40px 0}
#s-attract .hero img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s,transform 3s;transform:scale(.92);border-radius:60px}
#s-attract .hero img.on{opacity:1;transform:scale(1)}
#s-attract h1{font-size:92px;line-height:1.02;margin:0 60px}
#s-attract p{font-size:44px;opacity:.85;margin:30px 0}
.pulse{margin-top:30px;background:var(--mb-primario);color:var(--mb-primario-texto);font-size:48px;font-weight:800;padding:34px 80px;border-radius:999px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* categorías / items */
main{flex:1;overflow:auto;padding:36px 44px 220px}
h2{font-size:60px;margin:10px 0 30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.card{background:var(--mb-superficie);border:3px solid var(--mb-borde);border-radius:var(--r);padding:24px;text-align:left;color:var(--mb-texto);display:flex;flex-direction:column;gap:12px;min-height:200px}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:1;border-radius:18px;background:var(--mb-fondo-alt)}
.card b{font-size:38px}.card span{font-size:28px;color:var(--mb-texto-suave)}
.card .price{font-size:36px;color:var(--mb-primario);font-weight:800}
.tabs{display:flex;gap:16px;overflow:auto;padding:24px 44px 0}
.tab{white-space:nowrap;padding:20px 34px;border-radius:999px;font-size:30px;font-weight:700;background:var(--mb-superficie-alt);color:var(--mb-texto)}
.tab.on{background:var(--mb-primario);color:var(--mb-primario-texto)}
.foot{position:absolute;left:0;right:0;bottom:56px;padding:24px 44px;display:flex;gap:24px;background:linear-gradient(transparent,var(--mb-fondo) 30%)}
.btn{flex:1;padding:34px;border-radius:var(--r);font-size:40px;font-weight:800;background:var(--mb-primario);color:var(--mb-primario-texto)}
.btn.alt{background:var(--mb-superficie-alt);color:var(--mb-texto);flex:.6}
.btn[disabled]{opacity:.4}
/* detalle */
.detail-top{display:flex;gap:34px;align-items:center}
.detail-top img{width:330px;height:330px;border-radius:30px}
.detail-top h2{margin:0 0 10px}.detail-top p{font-size:30px;color:var(--mb-texto-suave);margin:0}
fieldset{border:0;margin:34px 0 0;padding:0}
legend{font-size:36px;font-weight:800;margin-bottom:16px}
.opts{display:flex;flex-wrap:wrap;gap:16px}
.opt{padding:24px 30px;border-radius:18px;font-size:30px;background:var(--mb-superficie);border:3px solid var(--mb-borde);color:var(--mb-texto);min-width:200px}
.opt.on{border-color:var(--mb-primario);background:var(--mb-primario);color:var(--mb-primario-texto)}
.opt small{display:block;font-size:24px;opacity:.8}
.qty{display:flex;align-items:center;gap:30px;font-size:48px;font-weight:800;margin-top:36px}
.qty button{width:96px;height:96px;border-radius:50%;font-size:52px;background:var(--mb-superficie-alt);color:var(--mb-texto)}
/* carrito */
.line{display:flex;gap:24px;align-items:center;padding:22px 0;border-bottom:2px solid var(--mb-borde)}
.line img{width:130px;height:130px;border-radius:16px}
.line div{flex:1}.line b{font-size:34px}.line span{display:block;font-size:24px;color:var(--mb-texto-suave)}
.line .lp{font-size:34px;font-weight:800}
.line button{width:72px;height:72px;border-radius:50%;font-size:36px;background:var(--mb-superficie-alt);color:var(--mb-texto)}
.total{display:flex;justify-content:space-between;font-size:52px;font-weight:800;margin-top:30px}
.upsell{margin-top:40px}.upsell .grid{grid-template-columns:1fr 1fr 1fr}
.upsell .card{min-height:0}.upsell .card b{font-size:28px}
/* pago */
#s-pay main{text-align:center}
#qr{display:inline-block;padding:30px;background:#fff;border-radius:30px;border:4px solid var(--mb-borde);cursor:pointer}
#qr img,#qr canvas{width:560px!important;height:560px!important}
.paynote{font-size:28px;color:var(--mb-texto-suave);margin:20px 60px}
.big{font-size:44px;font-weight:800}
/* número */
#s-done{background:var(--mb-primario);color:var(--mb-primario-texto);align-items:center;justify-content:center;text-align:center}
#s-done .num{font-size:300px;font-weight:900;line-height:1;margin:30px 0}
#s-done h2{font-size:64px}#s-done p{font-size:40px;margin:10px 60px}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40}
#overlay.on{display:flex}
#overlay iframe{width:860px;height:1400px;border:0;border-radius:30px;background:#fff}
#idle{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--mb-secundario);color:var(--mb-secundario-texto);padding:50px 70px;border-radius:30px;font-size:44px;font-weight:800;text-align:center;display:none;z-index:45}
#idle.on{display:block}
/* formatos: horizontal y cuadrado reorganizan, no encogen */
.grid{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
html[data-formato="horizontal"] #s-attract.on,html[data-formato="cuadrado"] #s-attract.on{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"hero logo" "hero h1" "hero p" "hero pulse";align-content:center;justify-items:center;column-gap:60px;padding:0 80px}
html[data-formato] #s-attract .logo{grid-area:logo}html[data-formato] #s-attract .hero{grid-area:hero}html[data-formato] #s-attract h1{grid-area:h1}html[data-formato] #s-attract p{grid-area:p}html[data-formato] #s-attract .pulse{grid-area:pulse}
html[data-formato="horizontal"] #s-attract .hero{width:600px;height:600px;flex:none;margin:0}
html[data-formato="cuadrado"] #s-attract .hero{width:420px;height:420px;flex:none;margin:0}
html[data-formato="horizontal"] #s-attract h1,html[data-formato="cuadrado"] #s-attract h1{font-size:76px;margin:0}
html[data-formato="cuadrado"] #s-attract p{font-size:36px}
html[data-formato="horizontal"] header.bar,html[data-formato="cuadrado"] header.bar{height:120px}
html[data-formato="horizontal"] main,html[data-formato="cuadrado"] main{padding-bottom:200px}
html[data-formato="horizontal"] .grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
html[data-formato="horizontal"] .card img,html[data-formato="cuadrado"] .card img{aspect-ratio:4/3;object-fit:contain}
html[data-formato="horizontal"] .foot{left:auto;width:min(1100px,60%)}
html[data-formato="horizontal"] #qr img,html[data-formato="horizontal"] #qr canvas,html[data-formato="cuadrado"] #qr img,html[data-formato="cuadrado"] #qr canvas{width:420px!important;height:420px!important}
html[data-formato="horizontal"] .detail-top img,html[data-formato="cuadrado"] .detail-top img{width:240px;height:240px}
/* pago: la botonera va en el flujo (no flota) para no tapar la línea de ayuda; el QR se encoge con el alto disponible */
#s-pay .foot{position:static;margin-bottom:56px;background:none;padding-top:12px}
#s-pay main{padding-bottom:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:size;min-height:0}
#s-pay main h2{margin:0 0 8px}#s-pay .paynote{margin:12px 40px}
#s-pay #qr{padding:min(30px,2cqh)}
#s-pay #qr img,#s-pay #qr canvas{width:min(560px,calc(100cqh - 360px),80cqw)!important;height:min(560px,calc(100cqh - 360px),80cqw)!important}
#doneQr{display:none;margin:24px auto 0;background:#fff;padding:18px;border-radius:22px;width:max-content}#doneQr.on{display:block}
#doneQr img,#doneQr canvas{width:260px!important;height:260px!important}
#s-done .follow{font-size:30px!important;font-weight:700}
html[data-formato="horizontal"] #doneQr img,html[data-formato="horizontal"] #doneQr canvas,html[data-formato="cuadrado"] #doneQr img,html[data-formato="cuadrado"] #doneQr canvas{width:180px!important;height:180px!important}
html[data-formato="horizontal"] #s-done .num{font-size:200px;margin:10px 0}
/* ── avatar en el quiosco (7-oct-2026): la conversación con el avatar rellena el carrito en vivo ── */
#stage{--av-h:0px;--av-w:0px}
html.av-on #stage{--av-h:560px}
html.av-on[data-formato="horizontal"] #stage{--av-h:0px;--av-w:460px}
html.av-on[data-formato="cuadrado"] #stage{--av-h:0px;--av-w:380px}
.screen{top:var(--av-h);left:var(--av-w)}
#avDock{display:none;position:absolute;left:0;top:0;right:0;height:var(--av-h);background:var(--mb-secundario);color:var(--mb-secundario-texto);z-index:20;grid-template-columns:400px minmax(0,1fr);gap:26px;padding:24px 32px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
html.av-on #avDock{display:grid}
html.av-on[data-formato="horizontal"] #avDock,html.av-on[data-formato="cuadrado"] #avDock{right:auto;bottom:56px;height:auto;width:var(--av-w);grid-template-columns:minmax(0,1fr);grid-template-rows:230px minmax(0,1fr);padding:20px;gap:14px}
html.av-on[data-formato="cuadrado"] #avDock{grid-template-rows:190px minmax(0,1fr)}
html.av-on[data-formato="horizontal"] .avTop h3,html.av-on[data-formato="cuadrado"] .avTop h3{font-size:28px}
html.av-on[data-formato="horizontal"] #avSaid,html.av-on[data-formato="cuadrado"] #avSaid{font-size:21px}
html.av-on[data-formato="horizontal"] #avOrder,html.av-on[data-formato="cuadrado"] #avOrder{font-size:21px}
html.av-on[data-formato="horizontal"] #avChips,html.av-on[data-formato="cuadrado"] #avChips{flex-wrap:nowrap;overflow-x:auto;flex:none}
html.av-on[data-formato="horizontal"] #avChips button,html.av-on[data-formato="cuadrado"] #avChips button{white-space:nowrap;font-size:19px}
#avFace{position:relative;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.08);min-height:0}
#avFace iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
#avPanel{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.avTop{display:flex;align-items:center;gap:14px}
.avTop h3{flex:1;margin:0;font-size:36px;line-height:1.1}
#avOff{background:transparent;color:inherit;border:3px solid currentColor;border-radius:999px;padding:8px 20px;font-size:22px;font-weight:700;white-space:nowrap}
#avSaid{font-size:25px;line-height:1.3;opacity:.92;margin:0;max-height:3.9em;overflow:hidden}
#avOrder{background:rgba(255,255,255,.1);border-radius:20px;padding:12px 18px;font-size:24px;flex:1;overflow:auto;min-height:60px}
#avOrder .ln{display:flex;gap:10px;justify-content:space-between;padding:3px 0}#avOrder small{opacity:.8;font-size:20px}
#avOrder .tt{font-weight:800;border-top:2px solid rgba(255,255,255,.25);margin-top:6px;padding-top:6px}
#avOrder .miss{color:var(--mb-acento);font-weight:800;margin-top:6px}
.pend{font-weight:800;color:var(--mb-error)}#avOrder .pend{color:var(--mb-acento)}
#avPending{display:none;align-items:center;gap:12px;background:var(--mb-acento);color:var(--mb-acento-texto);border-radius:16px;padding:10px 16px;font-size:22px;font-weight:700}
#avPending.on{display:flex}#avPending span{flex:1}#avPending button{border-radius:999px;padding:10px 22px;font-size:22px;font-weight:800;background:var(--mb-secundario);color:var(--mb-secundario-texto)}
#avChips{display:flex;gap:10px;flex-wrap:wrap}
#avChips button{padding:10px 18px;border-radius:999px;font-size:21px;background:rgba(255,255,255,.14);color:inherit}
#avAsk{display:flex;gap:12px;align-items:center}
#avAsk input{flex:1;min-width:0;font:inherit;font-size:28px;padding:16px 20px;border-radius:18px;border:0;background:#fff;color:#1E2A25;user-select:text;-webkit-user-select:text}
#avAsk button{width:80px;height:80px;flex:none;border-radius:50%;font-size:34px;background:var(--mb-primario);color:var(--mb-primario-texto)}
#avMic.on{background:var(--mb-error);animation:pulse 1s infinite}
.avToggle{display:none;margin-left:auto;margin-right:18px;background:var(--mb-primario);color:var(--mb-primario-texto);border-radius:999px;padding:12px 24px;font-size:26px;font-weight:800}
html.av-can:not(.av-on) .avToggle{display:inline-block}
html.av-on #s-attract .hero{width:500px;height:500px;margin:24px 0}
html.av-on #s-attract h1{font-size:80px}
.line.flash,#total.flash{animation:avflash 1.8s ease-out}
@keyframes avflash{0%{background:color-mix(in srgb,var(--mb-acento) 55%,transparent);transform:scale(1.015)}100%{background:transparent;transform:none}}
@media (prefers-reduced-motion:reduce){.line.flash,#total.flash{animation:none;outline:4px solid var(--mb-acento);outline-offset:4px}#avMic.on{animation:none}}
#confirm{position:absolute;top:var(--av-h);left:var(--av-w);right:0;bottom:56px;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:35}
#confirm.on{display:flex}
#confirm .sheet{background:var(--mb-superficie);color:var(--mb-texto);width:100%;border-radius:40px 40px 0 0;padding:40px 48px 44px;max-height:100%;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
html[data-formato="horizontal"] #confirm{align-items:center}html[data-formato="horizontal"] #confirm .sheet{width:min(1100px,92%);border-radius:40px}
#confirm h2{margin:0 0 6px}#confirm .who{font-size:34px;color:var(--mb-texto-suave);margin:0 0 14px}
#cfLines .line img{width:100px;height:100px}
#confirm .total{margin:18px 0 28px}
#confirm .acts{display:flex;gap:24px}
#cfOk{flex:1;padding:44px 30px;font-size:50px;border-radius:var(--r);font-weight:900;background:var(--mb-primario);color:var(--mb-primario-texto);box-shadow:0 8px 0 color-mix(in srgb,var(--mb-primario) 60%,#000)}
#cfNo{flex:.55}
/* ── /demo pedido (7-oct-2026): conversación Admirito ⇄ clienta, con subtítulos y toques visibles ── */
#demoTalk{display:none;position:absolute;left:calc(var(--av-w) + 24px);right:24px;top:calc(var(--av-h) + 8px);z-index:38;pointer-events:none;flex-direction:column;gap:8px}
#demoTalk.on{display:flex}
#demoTalk .dbadge{align-self:flex-end;display:flex;align-items:center;gap:10px;background:#C0392B;color:#fff;border-radius:999px;padding:4px 16px;font-size:18px;font-weight:800;letter-spacing:1px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#demoTalk .dbadge i{width:12px;height:12px;border-radius:50%;background:#fff;animation:recdot 1.2s infinite}
#demoTalk .dbadge small{font-weight:600;opacity:.85;letter-spacing:0}
@keyframes recdot{50%{opacity:.25}}
#demoBubbles{display:flex;flex-direction:column;gap:12px}
.db{max-width:92%;padding:10px 22px 14px;border-radius:26px;font-size:28px;line-height:1.22;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.db.new{animation:dbIn .2s ease-out}
.db span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.db b{display:flex;align-items:center;gap:10px;font-size:18px;letter-spacing:.6px;text-transform:uppercase;opacity:.9;margin-bottom:2px}
.db.adm{align-self:flex-start;background:var(--mb-superficie);color:var(--mb-texto);border:4px solid var(--mb-primario);border-bottom-left-radius:8px}
.db.adm b{color:var(--mb-primario)}
.db.cli{align-self:flex-end;background:var(--mb-acento);color:var(--mb-acento-texto);border-bottom-right-radius:8px}
.db .wv{display:none;gap:3px;align-items:flex-end;height:18px}.db.sp .wv{display:inline-flex}
.db .wv i{width:4px;height:100%;background:currentColor;border-radius:2px;animation:wv .9s infinite ease-in-out}
.db .wv i:nth-child(2){animation-delay:.15s}.db .wv i:nth-child(3){animation-delay:.3s}.db .wv i:nth-child(4){animation-delay:.45s}
.db.th span{opacity:.8;font-style:italic}
@keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes dbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* en 16:9 la hoja «¿Lo confirmo?» baja durante la demo para dejar sitio al subtítulo */
html.demo-on[data-formato="horizontal"] #confirm{align-items:flex-end}html.demo-on[data-formato="horizontal"] #confirm .sheet{border-radius:40px 40px 0 0}
#demoNote{display:none;align-self:center;background:#C0392B;color:#fff;border-radius:18px;padding:14px 24px;font-size:26px;font-weight:800;box-shadow:0 8px 28px rgba(0,0,0,.3)}
#demoNote.on{display:block}
#demoTap{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:6px solid #fff;background:rgba(255,255,255,.35);box-shadow:0 0 0 4px rgba(0,0,0,.25);z-index:60;pointer-events:none;opacity:0;transform:scale(.3)}
#demoTap.on{animation:demotap .6s ease-out}
@keyframes demotap{0%{opacity:.95;transform:scale(.3)}55%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
.demo-press{transform:scale(.96);filter:brightness(.9);transition:transform .12s,filter .12s}
@media (prefers-reduced-motion:reduce){.db,#demoTalk .dbadge i,.db .wv i{animation:none}#demoTap.on{animation:none;opacity:.9;transform:none}}
</style>
</head>
<body>
<div id="stage" role="application" aria-label="Quiosco de pedido">
  <section class="screen on" id="s-attract" data-marker="ATRACCION" data-zone="pantalla-atraccion">
    <div class="logo" data-logo></div>
    <div class="hero" id="hero"></div>
    <h1 data-t="attractTitle"></h1>
    <p data-t="attractSub"></p>
    <div class="pulse" data-t="start"></div>
    <div class="segOffer" id="segOffer"></div>
  </section>

  <section class="screen" id="s-menu" data-marker="CATEGORIAS">
    <header class="bar"><div class="logo" data-logo></div><button class="avToggle" type="button" data-av="on"></button><button class="lang" data-lang></button></header>
    <nav class="tabs" id="tabs"></nav>
    <main><h2 id="catTitle"></h2><div class="grid" id="items"></div></main>
    <div class="foot"><button class="btn alt" data-go="attract" data-t="cancel"></button><button class="btn" id="toCart" data-go="cart"></button></div>
  </section>

  <section class="screen" id="s-item" data-marker="PRODUCTO">
    <header class="bar"><div class="logo" data-logo></div><button class="avToggle" type="button" data-av="on"></button><button class="lang" data-lang></button></header>
    <main id="itemBody"></main>
    <div class="foot"><button class="btn alt" data-go="menu" data-t="back"></button><button class="btn" id="addBtn"></button></div>
  </section>

  <section class="screen" id="s-cart" data-marker="CARRITO">
    <header class="bar"><div class="logo" data-logo></div><button class="avToggle" type="button" data-av="on"></button><button class="lang" data-lang></button></header>
    <main><h2 data-t="yourOrder"></h2><div id="lines"></div><div class="total"><span data-t="total"></span><span id="total"></span></div>

function demoUntil(fn,ms){return new Promise(r=>{const t0=Date.now(),k=setInterval(()=>{let ok=false;try{ok=!!fn();}catch(_){}if(ok||Date.now()-t0>ms){clearInterval(k);r(ok);}},80);});}
function demoRender(){const s=KD.script(demoLang),b=$("#demoBubbles");$("#demoBadge").textContent=s.badge;$("#demoHint").textContent=s.hint;
  // una sola burbuja (la frase que suena ahora, o «Pensando…») para no tapar el carrito: Admirito a la izquierda, la clienta a la derecha
  const list=demoThink?[]:demoMsgs.slice(-1).map(m=>({m:m}));
  b.innerHTML=list.map(x=>'<div class="db '+(x.m.who==="customer"?"cli":"adm")+(x.m.sp?" sp":"")+(x.m.fresh?" new":"")+'"><b>'+(x.m.who==="customer"?avEsc(s.who+" · "+s.name):avEsc(s.admirito))+'<span class="wv"><i></i><i></i><i></i><i></i></span></b><span>'+avEsc(x.m.text)+'</span></div>').join("")
    +(demoThink?'<div class="db adm th new"><b>'+avEsc(s.admirito)+'</b><span>'+avEsc(s.thinking)+'</span></div>':"");demoMsgs.forEach(m=>{m.fresh=false;});}
function demoBubble(who,text,o){if(text==null){demoMsgs=[];demoThink=false;demoRender();return;}const sp=!!(o&&o.speaking),last=demoMsgs[demoMsgs.length-1];
  if(last&&last.who===who&&last.text===text)last.sp=sp;else demoMsgs.push({who:who,text:text,sp:sp,fresh:true});demoMsgs=demoMsgs.slice(-3);demoRender();}
// mientras la clienta habla, su frase aparece en la caja (como si dictara al micro) y luego viaja a la cara
function demoType(text,dur){clearInterval(demoTypeT);const w=String(text).split(" "),t0=Date.now(),ms=Math.max(.6,dur||1)*1000;
  demoTypeT=setInterval(()=>{const k=Math.min(w.length,Math.ceil(w.length*(Date.now()-t0)/ms));$("#avQ").value=w.slice(0,k).join(" ");if(k>=w.length)clearInterval(demoTypeT);},70);}
function demoTap(el){return new Promise(r=>{if(!el)return r();const st=$("#stage"),sr=st.getBoundingClientRect(),k=sr.width/st.offsetWidth||1,er=el.getBoundingClientRect(),t=$("#demoTap");
  t.style.left=((er.left+er.width/2-sr.left)/k)+"px";t.style.top=((er.top+er.height/2-sr.top)/k)+"px";t.classList.remove("on");void t.offsetWidth;t.classList.add("on");el.classList.add("demo-press");
  setTimeout(()=>{el.classList.remove("demo-press");r();},560);});}
function demoNote(msg){clearTimeout(demoNoteT);const n=$("#demoNote");n.textContent=msg;n.classList.add("on");$("#demoTalk").classList.add("on");
  demoNoteT=setTimeout(()=>{n.classList.remove("on");if(!demoOn())$("#demoTalk").classList.remove("on");},6000);}
function demoQuiet(){DA.stopAll();clearInterval(demoTypeT);try{$("#avQ").value="";$("#avMic").classList.remove("on");}catch(_){}}
const demoDeps={
  lang:()=>demoLang,menu:()=>M,onState:()=>demoClass(),
  prepare:async()=>{if(!avMounted)throw Object.assign(new Error("face"),{kind:"face"});
    // conversación nueva: si había un cliente a medias, vuelta a la atracción (cara nueva) antes de empezar
    if(cart.length||order||screen!=="attract"||avS.dirty||!avOn)go("attract");if(!avOn)avSetOn(true);
    avPost({type:"da-audio",on:false});avS.dirty=true; // sin voz en la cara: suena solo el quiosco (y el cerebro no gasta voz)
    if(!(await demoUntil(()=>avLoaded,10000)))throw Object.assign(new Error("face"),{kind:"face"});},
  speak:(who,text)=>{if(who==="customer")try{$("#avMic").classList.add("on");}catch(_){}
    return DA.speak(who,demoLang,text,who==="customer"?d=>demoType(text,d):null).then(()=>{clearInterval(demoTypeT);try{$("#avMic").classList.remove("on");if(who==="customer")$("#avQ").value=text;}catch(_){}});},
  prefetch:(who,text)=>DA.prefetch(who,demoLang,text),
  bubble:demoBubble,thinking:on=>{demoThink=!!on;demoRender();},
  ask:q=>avAsk(q),
  validate:a=>KA?KA.validateDraft(M,a,{stores:[avStore(),storeId,M.establishment.id]}):null,
  tapConfirm:async()=>{$("#avQ").value="";if(!(await demoUntil(()=>$("#confirm").classList.contains("on"),6000)))return false;await demoTap($("#cfOk"));if(!$("#confirm").classList.contains("on"))return false;
    $("#cfOk").click();return demoUntil(()=>screen==="pay",4000);},
  tapCounter:async()=>{$("#avQ").value="";if(!(await demoUntil(()=>screen==="pay",4000)))return null;await demoTap($("#payCounter"));if(screen!=="pay")return null;$("#payCounter").click();
    return (await demoUntil(()=>screen==="done"&&order&&order.number,9000))?order.number:null;},
  customerName:()=>custName()||(order&&order.customerName)||"",
  notice:msg=>demoNote(msg),
  cleanup:reason=>{demoQuiet();demoBubble(null);if(reason!=="fallo")$("#demoTalk").classList.remove("on");avPost({type:"da-audio",on:true});go("attract");},
  finish:()=>{avPost({type:"da-audio",on:true});setTimeout(()=>{if(!demoOn()){demoBubble(null);$("#demoTalk").classList.remove("on");}},7000);}
};
function demoToggle(){if(!KD||!avMounted)return "off";if(!demo){demo=KD.createDemo(demoDeps);window.__kioskDemo=demo;}
  if(demo.active()){demo.stop("comando");return "stopped";}
  DA.unlock(); // dentro del gesto (Intro / clic): desbloquea AudioContext y speechSynthesis
  demoLang=lang;demoMsgs=[];demoThink=false;clearTimeout(demoNoteT);$("#demoNote").classList.remove("on");$("#demoTalk").classList.add("on");demoRender();
  return demo.toggle("comando");}
// ── toques ──
document.addEventListener("pointerdown",e=>{lastTouch=lastHuman=Date.now();$("#idle").classList.remove("on");
  // tocar la pantalla para la demo (menos la caja del avatar: ahí se escribe «/demo pedido» para pararla)
  if(e.isTrusted&&demoOn()&&!(e.target&&e.target.closest&&e.target.closest("#avAsk"))){demoSwallow=Date.now();demo.stop("toque");}},true);
// ese toque solo para la demo (vuelve a la atracción): no se convierte además en un clic sobre lo que hubiera debajo
addEventListener("click",e=>{if(demoSwallow&&Date.now()-demoSwallow<1500){demoSwallow=0;e.stopPropagation();e.preventDefault();}},true);
// el nombre tecleado a mano manda sobre el que dicte el avatar (y el avatar se entera)
$("#custName").addEventListener("input",()=>{nameByUser=true;avManual();});
// escribir el nombre cuenta como actividad; Intro = continuar
document.addEventListener("keydown",e=>{lastTouch=lastHuman=Date.now();$("#idle").classList.remove("on");if(e.key==="Enter"&&e.target&&e.target.id==="avQ"){e.preventDefault();avAsk(e.target.value);return;}if(e.key==="Enter"&&screen==="name"){e.preventDefault();confirmName();}},true);
document.addEventListener("click",e=>{const el=e.target.closest("button,[data-zone],#qr");if(!el)return;
  if(el.id==="s-attract"||el.closest("#s-attract"))return go("menu");
  if(el.dataset.av)return avClick(el.dataset.av,el);
  if(el.id==="cfOk")return avConfirm("toque");
  if(el.id==="cfNo"){avCloseConfirm();return;}
  if(el.dataset.lang!==undefined){lang=lang==="es"?"en":"es";if(KS)KS.lang(lang);texts();if(screen==="menu")renderMenu();if(screen==="item")renderItem();if(screen==="cart")renderCart();avRender();if($("#confirm").classList.contains("on"))avOpenConfirm();avPost({type:"da-context",lang:lang});avPost({type:"da-lang",lang:lang});return;}
  if(el.dataset.go){if(el.dataset.go==="attract")cart=[];return go(el.dataset.go);}
  if(el.dataset.cat){cat=el.dataset.cat;return renderMenu();}
  if(el.dataset.item)return openItem(el.dataset.item);
  if(el.dataset.up){cur={item:M.items.find(i=>i.id===el.dataset.up),qty:1,sel:{}};addLine();renderCart();return avManual();}
  if(el.dataset.opt){const[g,c]=el.dataset.opt.split("|");return pick(g,c);}
  if(el.dataset.qty){cur.qty=Math.max(1,Math.min(9,cur.qty+(+el.dataset.qty)));return renderItem();}
  if(el.dataset.del){cart.splice(+el.dataset.del,1);renderCart();return avManual();}
  if(el.id==="addBtn"){addLine();go("cart");return avManual();}
  if(el.id==="toPay"&&cart.length)return askName();
  if(el.id==="toName")return confirmName();
  if(el.id==="payCounter"){if(!order)makeOrder();const o=order;return (o.queueNumber?Promise.resolve():Promise.race([colaCrear(o),new Promise(r=>setTimeout(r,1500))])).then(()=>finish("counter"));}
  if(el.id==="qr"){$("#payFrame").src=el.dataset.url+"&embed=1";$("#overlay").classList.add("on");}
});
// ── regla XPL de calle: 12 s sin tocar → vuelta a la atracción (en Pago, 60 s: se paga con el móvil) ──
setInterval(()=>{avTick();if(demoOn())lastTouch=Date.now();if(screen==="attract"||screen==="done")return;const lim=(screen==="pay"?60:screen==="name"?45:(M.idle.resetSeconds||12))*1000,warn=(M.idle.warnSeconds||4)*1000,idle=Date.now()-lastTouch;
  if(idle>=lim){host("reset",{reason:"idle"});go("attract");}else if(idle>=lim-warn){const el=$("#idle");el.textContent=t("idle")+Math.ceil((lim-idle)/1000)+" s";el.classList.add("on");}},250);
// atracción en bucle
let h=0;setInterval(()=>{const im=$$("#hero img");if(!im.length)return;im.forEach(x=>x.classList.remove("on"));im[h++%im.length].classList.add("on");},2500);
// ── Segmentado (Carlos, 8-oct-2026): la carta cambia según quién hay delante (segmento.js; ?seg=1 o /totem segmentado on) ──
// Variante = titular + subtítulo + oferta de la atracción y una pestaña «⭐ Para ti» con sus destacados. Nunca cambia
// mientras el cliente está pidiendo (segmento.js consulta ocupado()); los precios siguen siendo los de la carta.
const KS=window.KioskoSegmento&&window.KioskoSegmento.activo?window.KioskoSegmento:null;
const SEGT={es:{paraTi:{es:"⭐ Para ti",en:"⭐ For you"}},en:{paraTi:{es:"⭐ Para ti",en:"⭐ For you"}}};
let SEGV=null;
function segIds(){if(!SEGV||!M)return [];return (SEGV.destacados||[]).filter(id=>M.items.some(i=>i.id===id&&i.available!==false));}
function segPaint(){if(!M)return;const o=$("#segOffer");if(o){const t=SEGV&&SEGV.oferta?tr(SEGV.oferta):"";o.textContent=t?"🎯 "+t:"";o.classList.toggle("on",!!t);}
  const imgs=segIds().map(id=>M.items.find(i=>i.id===id).image).filter((s,k,a)=>a.indexOf(s)===k).slice(0,3),src=imgs.length?imgs:(M.attract.images||[]),hero=$("#hero");
  if(hero&&hero.dataset.src!==src.join("|")){hero.dataset.src=src.join("|");hero.innerHTML=src.map((s,k)=>'<img alt="" class="'+(k?"":"on")+'" src="'+s+'">').join("");}}
function segCambio(v){SEGV=v&&v.id!=="general"?v:null;document.documentElement.dataset.segVariante=v?v.id:"general";if(!M)return;
  if(screen==="attract"){texts();segPaint();}else if(screen==="menu"&&cat==="para-ti")renderMenu();}
function segPedido(o){try{if(KS&&o)KS.pedido(o.id,o.number||o.queueNumber||null);if(o)o.segmento=KS?{variante:(SEGV&&SEGV.id)||"general",regla:(KS.estado||{}).regla||null}:undefined;}catch(_){}}
// ── arranque ──
(async function(){try{M=await (await fetch(menuUrl,{cache:"no-cache"})).json();}catch(e){M=await (await fetch("menu.starbucks.json")).json();}
  $("#hero").innerHTML=(M.attract.images||[]).map((s,k)=>'<img alt="" class="'+(k?"":"on")+'" src="'+s+'">').join("");
  $$("[data-logo]").forEach(e=>e.textContent=(marca||M.establishment.brandId||"").toUpperCase());
  colaKeyFromUrl();if(KS)KS.init({tienda:colaStore(),marca:marca,lang:lang,host:P.get("host")||"",ocupado:()=>screen!=="attract",onCambio:segCambio});texts();avMount();await brand();window.__kioskReady=true;host("ready",{store:storeId,marca:marca});})();
window.kiosko={go:go,get state(){return{screen:screen,cart:cart,order:order,segmento:KS?KS.estado:null,variante:SEGV?SEGV.id:"general",avatar:{on:avOn,level:avLevel,pending:!!avS.pending,ready:!!(avS.r&&avS.r.ready),confirm:$("#confirm").classList.contains("on")}};},
  fill:d=>applyDraft(d,"api"),add:l=>kAdd(l,"api"),avatar:{on:()=>avSetOn(true),off:()=>avSetOn(false),ask:q=>avAsk(q)},
  demo:{toggle:()=>demoToggle(),stop:()=>!!(demo&&demo.stop("api")),get state(){return demo?{state:demo.state,turns:demo.turns,reason:demo.reason,number:demo.number,lang:demoLang}:{state:"idle"};}}};
})();
